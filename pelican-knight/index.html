    legacyRecords:{kills:0,time:0,wins:0},settings:{sound:false},lastSettlement:null};

function loadSave(){
  const base=freshSave();
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw){
      const legacy=JSON.parse(localStorage.getItem('pelican-coast-best-v1')||'null');
      if(legacy)for(const k of ['kills','time','wins'])base.legacyRecords[k]=integer(legacy[k]);
      return base;
    }
    const parsed=JSON.parse(raw);
    if(!parsed || parsed.schemaVersion!==1){saveBlocked=true;saveMessage='此存档版本无法读取，原存档已保留；本次进度无法自动保存。';return base;}
    base.wallet=integer(parsed.wallet);
    for(const [id,value] of Object.entries(parsed.apparel||{}))if(apparel[id]&&Number.isInteger(value)&&value>=0)base.apparel[id]=Math.min(3,value);
    const slots={weapon:weapons,hat:apparel,scarf:apparel,mount:mounts};
    for(const slot of Object.keys(slots)){
      const id=parsed.loadout?.[slot];
      if(slots[slot][id] && (!['hat','scarf'].includes(slot)||(apparel[id].slot===slot && base.apparel[id]!==undefined)))base.loadout[slot]=id;
    }
    base.claimed=quests.filter(q=>Array.isArray(parsed.claimed)&&parsed.claimed.includes(q.id)).map(q=>q.id);
    const valid=new Set(Array.isArray(parsed.talents)?parsed.talents:[]);
    for(const t of talents)if(valid.has(t.id)&&(!t.prev||base.talents.includes(t.prev))&&base.talents.length<talentPoints(base))base.talents.push(t.id);
    for(const k of Object.keys(base.records))base.records[k]=integer(parsed.records?.[k]);
    for(const k of Object.keys(base.legacyRecords))base.legacyRecords[k]=integer(parsed.legacyRecords?.[k]);
    base.settings.sound=parsed.settings?.sound===true;
    base.lastSettlement=typeof parsed.lastSettlement==='string'?parsed.lastSettlement:null;
    return base;
  }catch(_){saveBlocked=true;saveMessage='浏览器未能读取存档，原数据未覆盖；可在行囊导出本次进度。';return base;}
}
function persist(next){
  if(saveBlocked)return false;

  catch(_){saveDirty=true;saveMessage='保存失败：进度暂留本次页面。请在行囊重试保存或导出。';return false;}
}
function transact(change){

}

function pauseGame(){
  if(state==='playing'){
    state='paused';panelName='pause';
    showPanel('海风稍歇','暂停期间计时、冷却和敌人均停止。',
      button('继续冒险','close','','','primary')+button('放弃本局，返回营地','confirm-leave','','','secondary')+button('重开本局','confirm-restart','','','secondary')+'<p class="note">主动放弃或重开不结算海贝、任务进度与纪录。</p>');
  }else if(state==='paused')closePanel();
}
function finish(won){
  if(state!=='playing'||game.settled)return;
  game.settled=true;state=won?'won':'lost';clearInput();player.action=null;player.stomp=false;player.ram=player.dodge=0;
  const stages=Math.min(6,Math.floor(game.time/30)),base=stages*2,bonus=won?6:0,reward=base+bonus;
  const next=clone(save);
  if(next.lastSettlement!==game.id){
    next.wallet+=reward;next.records.runs++;next.records.totalKills+=game.kills;
    next.records.kills=Math.max(next.records.kills,game.kills);next.records.time=Math.max(next.records.time,Math.floor(game.time));
    if(won)next.records.wins++;next.lastSettlement=game.id;
    // 结算只发生一次。保存失败时保留内存结果与明确提示，返回营地不再发奖。
    if(!persist(next))saveDirty=true;
    save=next;
  }
  game.reward={stages,base,bonus,reward};showResult();updateHUD();sound(won?760:180,.3);
}
function showResult(){
  const r=game.reward;panelName='result';
  showPanel(state==='won'?'海岸，守住了。':'这次，先走到这里。','海风镇一直等你回来。',
    '<div class="summary"><div><b>'+formatTime(game.time)+'</b><span>生存时间</span></div><div><b>'+game.kills+'</b><span>击退敌人</span></div><div><b>'+game.level+'</b><span>本局等级</span></div></div><div class="ledger">完成阶段 '+r.stages+' / 6：+'+r.base+' 海贝<br>通关奖励：+'+r.bonus+' 海贝<br><strong>本次获得 '+r.reward+' 海贝 · 持有 '+save.wallet+'</strong></div><p class="note">'+(saveDirty||saveBlocked?saveMessage:'收益与纪录已自动保存。局内升级已结束，永久装备和天赋保留。')+'</p>'+button('返回海风镇','camp','','','primary')+button('再战海岸','start','','','secondary')+(saveDirty?button('查看存档 / 导出','records','','','secondary'):''));
}
function offerUpgrades(){
  game.xp-=game.need;game.level++;game.need=8+Math.round((game.level-1)*4.5);
  const pool=upgradeDefs.filter(u=>(game.build[u.id]||0)<u.max);offers=[];
  while(pool.length&&offers.length<3)offers.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  if(!offers.length){player.hp=Math.min(player.maxHp,player.hp+25);return;}
  state='upgrade';panelName='upgrade';
  showPanel('海风带来新本领','本局成长 · 按 1 / 2 / 3 选择',
    '<div class="cards">'+offers.map((u,i)=>'<article class="card"><span class="tag">0'+(i+1)+' · '+((game.build[u.id]||0)+1)+' / '+u.max+'</span><h3>'+u.name+'</h3><p>'+u.desc+'</p>'+button('选择','choose',String(i))+'</article>').join('')+'</div>');
}
function chooseUpgrade(index){
  if(state!=='upgrade'||!offers[index])return;
  const u=offers[index];game.build[u.id]=(game.build[u.id]||0)+1;
  const oldHp=player.hp;Object.assign(player,stats(save,game.build));player.hp=Math.min(player.maxHp,oldHp+(u.id==='vital'?30:0));
  offers=[];state='playing';closePanel();toast(u.name+' · 本局生效');updateHUD();
}
$('panel-content').addEventListener('click',event=>{
  const b=event.target.closest('button[data-action]');if(!b||b.disabled)return;
  const action=b.dataset.action,id=b.dataset.id;
  if(action==='close'){if(['won','lost'].includes(state))showResult();else closePanel();return;}
  if(action==='start'){if(['camp','won','lost'].includes(state))startGame();return;}
  if(action==='camp'){if(['won','lost','paused'].includes(state))showCamp();return;}
  if(action==='records'){openRecords();return;}
  if(action==='choose'){chooseUpgrade(Number(id));return;}
  if(action==='confirm-leave'||action==='confirm-restart'){
    if(state!=='paused')return;panelName='confirm';
    showPanel('放弃当前冒险？','本局未结算的海贝和任务进度将不保留。',button('继续当前冒险','close','','','primary')+button(action==='confirm-leave'?'确认返回营地':'确认重开',action==='confirm-leave'?'camp':'restart','','','secondary'));return;
  }
  if(action==='restart'){if(state==='paused')startGame();return;}
  if(action==='export'){
    const url=URL.createObjectURL(new Blob([JSON.stringify(save,null,2)],{type:'application/json'}));
    const link=document.createElement('a');link.href=url;link.download='pelican-knight-save.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return;
  }
  if(action==='retry-save'){if(persist(save)){toast('已保存当前进度');openRecords();}else toast(saveMessage,4);updateHUD();return;}
  if(state!=='camp')return;
  let changed=false;
  if(action==='weapon'&&weapons[id])changed=transact(s=>{s.loadout.weapon=id;});
  if(action==='mount'&&mounts[id])changed=transact(s=>{s.loadout.mount=id;});
  if(action==='apparel'&&apparel[id])changed=transact(s=>{if(s.apparel[id]===undefined)return false;s.loadout[apparel[id].slot]=id;});
  if(action==='buy-apparel'&&apparel[id])changed=transact(s=>{const a=apparel[id];if(s.apparel[id]!==undefined||s.wallet<a.price)return false;s.wallet-=a.price;s.apparel[id]=0;s.loadout[a.slot]=id;});
  if(action==='upgrade-apparel'&&apparel[id])changed=transact(s=>{const level=s.apparel[id];if(level===undefined||level>=3||s.wallet<12*(level+1))return false;s.wallet-=12*(level+1);s.apparel[id]++;s.records.upgrades++;});
  if(action==='talent')changed=transact(s=>{
    const t=talents.find(t=>t.id===id);if(!t)return false;
    if(s.talents.includes(id)){
      s.talents=s.talents.filter(x=>x!==id);
      // 前置取消时顺序移除后续节点，点数由已激活列表派生，避免重复退点。
      for(const next of talents)if(next.prev&&!s.talents.includes(next.prev))s.talents=s.talents.filter(x=>x!==next.id);
    }else{if(s.talents.length>=talentPoints(s)||(t.prev&&!s.talents.includes(t.prev)))return false;s.talents.push(id);s.records.lessons=1;}
  });
  if(action==='reset-talents')changed=transact(s=>{s.talents=[];});
  if(action==='claim')changed=transact(s=>{const q=quests.find(q=>q.id===id);if(!q||s.claimed.includes(id)||q.progress(s)<q.goal)return false;s.claimed.push(id);s.wallet+=q.reward;});
  if(changed){if(action==='mount')player.mounted=false;refreshCampPlayer();openCampPanel(panelName);sound(660);}
});

const enemyKinds={...contentTable('monster'),dummy:{...assetIndex['PROP-001'].definition,assetId:'PROP-001'}};
function spawnEnemy(kind,x=null,d=null){
  if(game.enemies.filter(e=>!e.dead).length>=45&&kind!=='boss')return;
  const def=enemyKinds[kind],side=player.x>2800?-1:player.x<500?1:(Math.random()<.5?-1:1);
  if(x===null)x=clamp(player.x+side*(width*.5+90),60,3340);
  if(d===null)d=rand(-35,65);
  const root=node('g',{},layers.actors);
  node('ellipse',{rx:def.r,ry:6,fill:'#657c54',opacity:.18},root);
  const visual=node('g',{},root);
  sprite(def.art,visual,{transform:'translate(0 '+(-def.offset)+') scale('+(def.scale||1)+')'});
  const hp=def.hp*(kind==='boss'||kind==='dummy'?1:1+Math.min(game.time,180)*.0018);
  const e={...def,kind,x,d,z:def.z||0,hp,maxHp:hp,root,visual,dead:false,age:0,hit:0,stun:0,attackCd:1,wind:0,attacking:false,face:1,shootCd:rand(1.5,3),chargeCd:6,charge:0,chargeWind:0,chargeDir:1,warning:null};
  game.enemies.push(e);
  if(kind==='boss'){game.boss=e;game.bossSpawned=true;$('boss-hud').hidden=false;toast('寄居蟹首领登场 · 红色预警后将冲锋！',4);sound(160,.3);}
}
function spawnDirector(dt){
  game.spawnTimer-=dt;
  if(game.spawnTimer<=0){
    game.spawnTimer=Math.max(.65,1.65-game.time*.005);
    const pool=game.time<20?['crab','gull']:game.time<55?['crab','gull','urchin']:['crab','gull','urchin','jelly'];
    spawnEnemy(pool[Math.floor(Math.random()*pool.length)]);
  }
  for(const t of [35,75,110,165])if(game.time>=t&&!game.events.has(t)){
    game.events.add(t);for(let i=0;i<5;i++)spawnEnemy(i===4?'elite':i%2?'crab':'gull');
    toast('潮汐来袭 · 留意两侧敌人',3);
  }
  if(game.time>=BOSS_AT&&!game.bossSpawned)spawnEnemy('boss');
}
function numberAt(x,d,z,value,color='#477962'){
  const el=textNode(String(value),x,ground(d)-z,15,layers.effects,color);
  el.classList.add('floating-damage');game.effects.push({el,kind:'number',x,y:ground(d)-z,life:.65,max:.65});
}
function ringAt(x,d,z,r,color='#ead89c'){
  const el=node('ellipse',{cx:x,cy:ground(d)-z,rx:5,ry:3,fill:'none',stroke:color,'stroke-width':4},layers.effects);
  game.effects.push({el,kind:'ring',r,life:.4,max:.4});
}
function slashAt(x,d,z,range,face,color='#f7edbd'){
  const el=node('path',{d:'M'+(-range*.1)+' -35Q'+range+' -60 '+range+' 0Q'+range+' 25 '+(-range*.1)+' 35',fill:color,stroke:'#c7b47b','stroke-width':1,opacity:.7,transform:'translate('+x+' '+(ground(d)-z)+') scale('+face+' 1)'},layers.effects);
  game.effects.push({el,kind:'fade',life:.18,max:.18});
}
function dropAt(x,d,value,type='pearl'){
  const el=node('g',{},layers.drops);
  sprite(type==='heart'?'art-heart':'art-pearl',el);
  game.drops.push({x,d,value,type,el,age:0,pull:false});
}
function hurtEnemy(e,damage,critical=false,knock=0){
  if(e.dead)return;
  e.hp-=damage;e.hit=.13;
  numberAt(e.x,e.d,e.z+e.h+5,Math.round(damage),critical?'#b48638':'#477962');
  if(e.kind==='dummy'){e.hp=e.maxHp;return;}
  if(knock&&e.kind!=='boss'){e.x=clamp(e.x+player.facing*knock,50,3350);e.stun=Math.max(e.stun,.16);}
  if(e.hp>0)return;
  e.dead=true;e.root.remove();if(e.warning)e.warning.remove();game.kills++;
  ringAt(e.x,e.d,e.z+14,e.r+10);
  dropAt(e.x,e.d,e.xp);
  if(Math.random()<.07)dropAt(e.x+rand(-20,20),e.d,12,'heart');
  if(e.kind==='boss'){
    game.bossDead=true;$('boss-hud').hidden=true;
    for(let i=0;i<7;i++)dropAt(e.x+rand(-80,80),e.d+rand(-20,20),3);
    dropAt(e.x,e.d,30,'heart');toast('首领已击败 · 坚持到退潮！',4);sound(800,.25);
  }
}
function hurtPlayer(amount,sx,sd,unblockable=false){
  const p=player;if(state!=='playing'||p.inv>0)return;
  const front=(sx-p.x)*p.facing>=-5;
  if(p.block&&front&&!unblockable&&Math.abs(sd-p.d)<70){
    const cost=amount*2.4;p.guard=Math.max(0,p.guard-cost);ringAt(p.x+p.facing*23,p.d,p.z+40,28,'#9cbba1');
    if(p.guard>0){sound(330);return;}
    p.block=false;p.stun=.75;toast('架势耗尽 · 破防',1.5);
  }
  const hit=Math.max(1,amount-p.armor);
  p.hp=Math.max(0,p.hp-hit);p.inv=.65;p.stun=Math.max(p.stun,.12);
  p.action=null;p.charging=false;p.charge=0;p.block=false;p.stomp=false;p.ram=0;
  game.flash=.6;numberAt(p.x,p.d,p.z+95,'−'+Math.round(hit),'#bd624f');sound(145,.12);
}
function melee(range,damage,knock=20,halfDepth=40,face=player.facing){
  const p=player;slashAt(p.x,p.d,p.z+36,range,face);
  for(const e of game.enemies){
    const dx=(e.x-p.x)*face;
    if(!e.dead&&e.age>.2&&dx>=-18&&dx<=range+e.r&&Math.abs(e.d-p.d)<halfDepth&&Math.abs((e.z+e.h*.5)-(p.z+38))<55)
      hurtEnemy(e,damage,false,knock);
  }
}
function areaAttack(x,d,z,r,damage,mountAttack=false){
  ringAt(x,d,z,r,mountAttack?'#c7ad76':'#88bdb2');
  for(const e of game.enemies)if(!e.dead&&Math.abs(e.x-x)<r+e.r&&Math.abs(e.d-d)<52&&Math.abs(e.z+e.h*.5-z)<80)hurtEnemy(e,damage,false,mountAttack?28:16);
}
function frontTarget(range,face=player.facing){
  let target=null,closest=range;
  for(const e of game.enemies){
    const dist=(e.x-player.x)*face;
    if(!e.dead&&e.age>.2&&dist>0&&dist<closest&&Math.abs(e.d-player.d)<42){target=e;closest=dist;}
  }
  return target;
}
function emitShot({team='hero',x=player.x,d=player.d,z=player.z+36,vx,vd=0,vz=0,damage=20,life=1.2,pierce=0,type='arrow',critical=false,group=null}){
  const el=node('g',{},layers.projectiles);
  if(type==='arrow')el.innerHTML='<path d="M-13 0h29m-5-4 6 4-6 4m-21-3-4 3 4 3" stroke="#5c7966" stroke-width="2.4" fill="none" stroke-linecap="round"/>';
  else if(type==='pellet')node('circle',{r:3.2,fill:'#c89d57',stroke:'#fff2c9'},el);
  else if(team==='enemy')node('circle',{r:6,fill:'#a184a0',stroke:'#faf0d4','stroke-width':2},el);
  else{node('circle',{r:type==='motor'?5:8,fill:type==='motor'?'#d8af6e':'#7cb8ad',stroke:'#e5f0ca','stroke-width':2},el);}
  const shot={id:nextShot++,team,x,d,z,vx,vd,vz,damage,life,pierce,type,critical,group,el,hits:new Set()};
  game.shots.push(shot);return shot;
}
function fireWeaponShot(type,damage,range,face=player.facing,pierce=0,spread=0,group=null){
  const speed=type==='pellet'?740:type==='orb'?460:630;
  const target=frontTarget(range,face),startZ=player.z+36;
  const time=target?Math.max(.15,Math.abs(target.x-player.x)/speed):1;
  const vd=target?clamp((target.d-player.d)/time,-100,100):0;
  const vz=target?clamp((target.z+target.h*.55-startZ)/time,-190,190):0;
  emitShot({type,x:player.x+face*24,z:startZ,vx:speed*face,vd:vd+spread,vz,damage,life:range/speed,pierce,group});
}
function beginAttack(special=false,power=0){
  const p=player,w=weapons[game.loadout.weapon];
  if(!canControl()||p.action||p.stun>0||p.switchTime>0||p.dodge>0||p.ram>0||p.stomp||p.block||p.charging)return;
  if(game.camp&&Math.abs(p.x-1135)>220){if(toastTime<=0)toast('走到武器架右侧的木桩旁试招');return;}
  if(game.loadout.weapon==='shotgun'){
    if(special||p.ammo<=0){if(p.ammo<4)p.action={kind:'reload',time:0,wind:1.25,duration:1.3,done:false};return;}
    p.ammo--;
  }
  if(special&&game.loadout.weapon==='staff'){
    if(p.mana<30){toast('法力不足 · 可继续普通攻击',1.5);return;}p.mana-=30;
  }
  const combo=p.comboTime>0?p.combo:0,comboMax=game.loadout.weapon==='katana'?3:game.loadout.weapon==='shield'?2:1;
  p.combo=(combo+1)%comboMax;p.comboTime=1.1;
  const wind=special?(game.loadout.weapon==='hammer'?.24:.12):w.wind;
  const recovery=w.recovery*p.recovery*(special?1.45:(game.loadout.weapon==='katana'&&combo===2?1.6:1));
  p.action={kind:'attack',time:0,wind,duration:wind+recovery,done:false,special,power,combo,face:p.facing};
}
function activateSkill(pressed,cancel=false){
  const p=player,w=weapons[game.loadout.weapon];
  if(!pressed){
    const charge=p.charge,was=p.charging;p.block=false;p.charging=false;p.charge=0;
    if(was&&!cancel)beginAttack(true,Math.min(charge/1.25,1));return;
  }
  if(!canControl()||p.action||p.stun>0||p.dodge>0||p.ram>0||p.stomp||p.switchTime>0)return;
  if(game.loadout.weapon==='shield'){if(p.guard>8)p.block=true;else toast('架势恢复中');return;}
  if(w.hold){if(game.camp&&Math.abs(p.x-1135)>220){toast('走到练习木桩旁试招');return;}p.charging=true;p.charge=0;}
  else beginAttack(true);
}
function performAttack(a){
  const p=player,id=game.loadout.weapon,w=weapons[id];
  const critical=Math.random()<p.crit;
  let damage=w.damage*p.damage*(critical?1.7:1);
  if(a.special)damage*=1.4+a.power*1.8;
  if(id==='bow'){fireWeaponShot('arrow',damage,w.range,a.face,a.special?2:0);}
  else if(id==='shield'){melee(w.range,damage*(a.combo===1?1.25:1),16,38,a.face);}

function canControl(){return (state==='camp'||state==='playing')&&!dialog.open;}
function updatePlayer(dt){
  const p=player;
  for(const key of ['stun','inv','dodge','dodgeCdLeft','ram','ramCd','stompCd','motorCd','switchTime','comboTime'])p[key]=Math.max(0,p[key]-dt);
  p.mana=Math.min(100,p.mana+12*dt);if(!p.block)p.guard=Math.min(100,p.guard+24*dt);
  p.hp=Math.min(p.maxHp,p.hp+p.regen*dt);
  if(p.charging)p.charge=Math.min(1.5,p.charge+dt);
  let mx=Number(keys.has('KeyD')||keys.has('ArrowRight'))-Number(keys.has('KeyA')||keys.has('ArrowLeft'))+touch.x;
  let md=Number(keys.has('KeyS')||keys.has('ArrowDown'))-Number(keys.has('KeyW')||keys.has('ArrowUp'))+touch.y;
  if(Math.abs(mx)+Math.abs(md)>.1)travelTarget=null;
  if(game.camp&&travelTarget){
    const target=places[travelTarget],dx=target.x-p.x,dd=30-p.d;
    if(Math.abs(dx)<7&&Math.abs(dd)<7){const id=travelTarget;travelTarget=null;openCampPanel(id);return;}
    mx=clamp(dx/30,-1,1);md=clamp(dd/20,-1,1);
  }
  const norm=Math.max(1,Math.hypot(mx,md));mx/=norm;md/=norm;
  if(Math.abs(mx)>.08&&!p.action&&p.ram<=0&&p.dodge<=0)p.facing=mx>0?1:-1;
  let speed=p.speed*(p.mounted?mounts[game.loadout.mount].speed:1);
  if(p.block||p.charging)speed*=.35;if(p.action)speed*=.5;if(p.stun>0||p.switchTime>0)speed=0;
  const oldX=p.x;
  if(p.ram>0||p.dodge>0)p.x+=p.facing*(p.ram>0?760:690)*dt;
  else{p.x+=mx*speed*dt;p.d+=md*speed*.48*dt;}
  p.x=clamp(p.x,65,game.camp?2135:3335);p.d=clamp(p.d,-40,75);
  if(p.ram>0){
    for(const e of game.enemies)if(!e.dead&&!p.ramHits.has(e)&&e.x>=Math.min(oldX,p.x)-e.r&&e.x<=Math.max(oldX,p.x)+e.r&&Math.abs(e.d-p.d)<42&&e.z<65){
      p.ramHits.add(e);hurtEnemy(e,62,false,32);
    }
    if(p.x===65||p.x===3335)p.ram=0;
  }
  p.moving=Math.abs(p.x-oldX)>.1||Math.abs(md)>.1;p.cycle+=dt*(p.moving?(p.mounted?13:10):2);
  if(p.z>0||p.vz>0){
    p.z+=p.vz*dt;p.vz-=1250*dt;
    if(p.z<=0){p.z=0;p.vz=0;if(p.stomp){areaAttack(p.x,p.d,15,135,55,true);p.stomp=false;}}
  }
  if(p.action){
    const a=p.action;a.time+=dt;
    if(!a.done&&a.time>=a.wind){a.done=true;if(a.kind==='reload')p.ammo=4;else performAttack(a);}
    if(a.time>=a.duration)p.action=null;
  }
  if((keys.has('KeyJ')||held.has('attack'))&&!p.charging)beginAttack();
  if(!game.camp&&p.mounted&&mounts[game.loadout.mount].auto&&p.motorCd<=0&&p.switchTime<=0){
    if(frontTarget(620)){fireWeaponShot('motor',24,620);p.motorCd=3;sound(260);}
  }
}
function fireEnemy(e,spread=0){
  const dx=player.x-e.x,dd=player.d-e.d,time=Math.max(.4,Math.abs(dx)/190);
  emitShot({team:'enemy',type:'enemy',x:e.x,d:e.d,z:e.z+e.h*.6,vx:Math.sign(dx||1)*190,vd:clamp(dd/time,-100,100)+spread,vz:clamp((player.z+35-e.z-e.h*.6)/time,-100,100),damage:e.kind==='boss'?14:10,life:4});
}
function updateEnemies(dt){
  const p=player;
  for(const e of game.enemies){
    if(e.dead)continue;e.age+=dt;e.hit=Math.max(0,e.hit-dt);e.stun=Math.max(0,e.stun-dt);
    if(e.kind==='dummy')continue;
    e.attackCd-=dt;e.shootCd-=dt;e.chargeCd-=dt;
    const dx=p.x-e.x,dd=p.d-e.d,dist=Math.hypot(dx,dd*1.8);
    let movement=true;
    if(e.kind==='gull')e.z=34+Math.sin(e.age*4)*8;
    if(e.kind==='jelly'){
      if(Math.abs(dx)<235)movement=false;
      if(e.shootCd<=0&&Math.abs(dx)<690){e.shootCd=3.1;fireEnemy(e);}
    }
    if(e.kind==='boss'){
      const enraged=e.hp<e.maxHp*.5;
      if(e.shootCd<=0&&Math.abs(dx)<720){e.shootCd=enraged?2.5:3.6;for(const v of [-65,0,65])fireEnemy(e,v);}
      if(e.chargeCd<=0&&!e.chargeWind&&!e.charge){
        e.chargeCd=enraged?6:8;e.chargeWind=.9;e.chargeDir=Math.sign(dx||1);
        e.warning=node('rect',{x:e.chargeDir>0?e.x:e.x-480,y:ground(e.d)-22,width:480,height:40,rx:16,fill:'#c97763',opacity:.3},layers['ground-effects']);
      }
      if(e.chargeWind>0){movement=false;e.chargeWind=Math.max(0,e.chargeWind-dt);if(e.chargeWind===0){e.charge=.72;e.warning.remove();e.warning=null;}}
      else if(e.charge>0){
        movement=false;e.charge=Math.max(0,e.charge-dt);
        const before=e.x;e.x=clamp(e.x+e.chargeDir*480*dt,60,3340);
        if(p.x>=Math.min(before,e.x)-65&&p.x<=Math.max(before,e.x)+65&&Math.abs(p.d-e.d)<45&&p.z<75)hurtPlayer(e.damage+5,e.x,e.d,true);
      }
    }
    if(e.wind>0){
      movement=false;e.wind=Math.max(0,e.wind-dt);
      if(e.wind===0){
        if(Math.abs(p.x-e.x)<e.r+42&&Math.abs(p.d-e.d)<38&&p.z<e.z+e.h&&p.z+65>e.z&&(p.x-e.x)*e.face>=-10)hurtPlayer(e.damage,e.x,e.d);
        ringAt(e.x+e.face*22,e.d,e.z+20,28,'#d5a18a');e.attackCd=1.5;
      }
    }else if(e.attackCd<=0&&Math.abs(dx)<e.r+35&&Math.abs(dd)<33&&!e.charge&&!e.chargeWind){
      e.wind=.43;e.face=Math.sign(dx||1);movement=false;
    }
    if(movement&&e.stun<=0&&e.age>.5){
      const norm=Math.max(1,dist);
      e.x=clamp(e.x+dx/norm*e.speed*dt,55,3345);e.d=clamp(e.d+dd/norm*e.speed*dt,-40,75);
    }
  }
  const alive=game.enemies.filter(e=>!e.dead);
  for(let i=0;i<alive.length;i++)for(let j=i+1;j<alive.length;j++){
    const a=alive[i],b=alive[j],dx=b.x-a.x,dd=b.d-a.d;
    if(Math.abs(dx)<(a.r+b.r)*.65&&Math.abs(dd)<20){const push=(dx>=0?1:-1)*12*dt;if(a.kind!=='boss')a.x-=push;if(b.kind!=='boss')b.x+=push;}
  }
  game.enemies=alive;
}
function shotHits(s,old,target,radius,height){
  const dx=s.x-old.x,dd=s.d-old.d;
  const t=clamp(((target.x-old.x)*dx+(target.d-old.d)*dd*4)/(dx*dx+dd*dd*4||1),0,1);
  const x=old.x+t*dx,d=old.d+t*dd,z=old.z+t*(s.z-old.z);
  return Math.abs(x-target.x)<radius+6&&Math.abs(d-target.d)<27&&z>=target.z-4&&z<=target.z+height+4;
}
function updateShots(dt){
  for(const s of game.shots){
    s.life-=dt;const old={x:s.x,d:s.d,z:s.z};
    s.x+=s.vx*dt;s.d+=s.vd*dt;s.z+=s.vz*dt;
    if(s.team==='hero'){
      for(const e of game.enemies){
        if(e.dead||s.hits.has(e)||e.age<.2||!shotHits(s,old,e,e.r,e.h))continue;
        s.hits.add(e);let amount=s.damage;
        if(s.group){const hits=s.group.get(e)||0;s.group.set(e,hits+1);amount*=Math.pow(.72,hits);}
        if(s.type==='pellet')amount*=clamp(s.life/.39,.35,1);
        hurtEnemy(e,amount,s.critical,3);
        if(s.pierce<=0){s.life=0;break;}s.pierce--;
      }
    }else if(shotHits(s,old,player,18,72)){
      hurtPlayer(s.damage,old.x,old.d);s.life=0;
    }
    if(s.z<0||s.x<0||s.x>3400)s.life=0;
    if(s.life<=0)s.el.remove();
    else s.el.setAttribute('transform','translate('+s.x+' '+(ground(s.d)-s.z)+') rotate('+(Math.atan2(s.vd*.62-s.vz,s.vx)*180/Math.PI)+')');
  }
  game.shots=game.shots.filter(s=>s.life>0);
}

const stick=$('joystick');
function moveStick(event){
  if(event.pointerId!==touch.id)return;
  const r=stick.getBoundingClientRect(),dx=event.clientX-r.left-r.width/2,dy=event.clientY-r.top-r.height/2;
  const limit=r.width*.32,ratio=Math.min(1,limit/(Math.hypot(dx,dy)||1));
  touch.x=dx*ratio/limit;touch.y=dy*ratio/limit;
  $('joystick-knob').style.transform='translate('+(dx*ratio)+'px,'+(dy*ratio)+'px)';
}
stick.addEventListener('pointerdown',event=>{
  if(!canControl()||touch.id!==null)return;event.preventDefault();touch.id=event.pointerId;stick.setPointerCapture(event.pointerId);moveStick(event);
});
stick.addEventListener('pointermove',moveStick);
for(const name of ['pointerup','pointercancel','lostpointercapture'])stick.addEventListener(name,event=>{
  if(event.pointerId!==touch.id)return;touch.id=null;touch.x=touch.y=0;$('joystick-knob').style.transform='';
});
window.addEventListener('keydown',event=>{
  const code=event.code;
  if(dialog.open){
    if(state==='paused'&&code==='KeyP'&&!event.repeat){event.preventDefault();closePanel();return;}
    if(state==='upgrade'&&['Digit1','Digit2','Digit3'].includes(code)&&!event.repeat){event.preventDefault();chooseUpgrade(Number(code.slice(-1))-1);}
    return;
  }
  if(['Space','Enter'].includes(code)&&event.target.tagName==='BUTTON')return;
  const controlled=['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowLeft','ArrowDown','ArrowRight','Space','ShiftLeft','ShiftRight','KeyJ','KeyK','KeyE','KeyR'];
  if(controlled.includes(code))event.preventDefault();
  if(event.repeat)return;
  if(code==='Escape'||code==='KeyP'){pauseGame();return;}
  if(!canControl())return;
  keys.add(code);
  if(code==='KeyE')interact();
  if(code==='Space')jump();
  if(code==='ShiftLeft'||code==='ShiftRight')dash();
  if(code==='KeyR')toggleMount();
  if(code==='KeyK')activateSkill(true);
  if(code==='KeyJ')beginAttack();
});
window.addEventListener('keyup',event=>{
  const was=keys.has(event.code);keys.delete(event.code);
  if(event.code==='KeyK'&&was)activateSkill(false,!canControl());
});
function loseFocus(){
  clearInput();pointerActions.clear();if(state==='playing')pauseGame();last=null;
}
window.addEventListener('blur',loseFocus);
document.addEventListener('visibilitychange',()=>{if(document.hidden)loseFocus();last=null;});
new ResizeObserver(resize).observe(stage);
showCamp();resize();
if(!saveBlocked&&!persist(save))toast(saveMessage,5);
updateHUD();
function frame(now){
  const dt=last===null?0:Math.min(.033,(now-last)/1000);last=now;
  if(canControl()){
    game.time+=game.camp?0:dt;updatePlayer(dt);
    // 自动走到建筑会打开窗口；本帧随即停止，不能多执行一次攻击或敌人更新。
    if(canControl()){
      if(!game.camp)spawnDirector(dt);
      updateEnemies(game.camp?0:dt);
      if(game.camp)for(const e of game.enemies){e.age+=dt;e.hit=Math.max(0,e.hit-dt);}
      updateShots(dt);updateDrops(dt);updateEffects(dt);
      if(!game.camp){
        if(player.hp<=0)finish(false);
        else if(game.time>=GOAL&&game.bossDead)finish(true);
        else if(game.xp>=game.need)offerUpgrades();
      }
    }
  }
  if(toastTime>0){toastTime-=dt;if(toastTime<=0)$('toast').classList.remove('visible');}
  render();hudClock-=dt;if(hudClock<=0){hudClock=.08;updateHUD();}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();

</script>
